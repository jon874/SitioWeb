<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Transformaciones</title>
    <style>
        body {
            background: url(opi.jpg);
            background-size: cover;
            background-position: center;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        header {
            background-color: rgba(241, 213, 213, 0.6);
            color: white;
            text-align: center;
            padding: 20px;
            font-size: 32px;
            font-weight: bold;
            letter-spacing: 1px;
        }

        .container {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 60px;
            padding: 40px;
            height: calc(100vh - 80px); /* Resta la altura del header */
        }

        .transform {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 400px;
            height: 300px;
            background: rgba(99, 20, 20, 0.85); /* fondo semitransparente */
            color: white;
            font-size: 20px;
            border-radius: 20px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.3);
            transition: transform 1s;
            cursor: pointer;
            padding: 20px;
            text-align: center;
        }

        .transform:hover {
            transform: rotate(10deg) scale(1.05);
        }

        .origin1 {
            transform-origin: top left;
        }

        .origin2 {
            transform-origin: top right;
        }

        .transform img {
            max-width: 100%;
            max-height: 100%;
            border-radius: 15px;
            object-fit: cover;
        }
        .volver {
            position: absolute;
            top: 20px;
            left: 20px;
            background-color: #333;
            color: white;
            padding: 10px 20px;
            text-decoration: none;
            border-radius: 8px;
            box-shadow: 2px 2px 10px rgba(0, 0, 0, 0.5);
            font-family: Arial, sans-serif;
            transition: background-color 0.3s ease;
            z-index: 2; /* Asegura que el botón quede encima */
        }

        .volver:hover {
            background-color: #555;
        }
    </style>
</head>
<body>
    <a href="uta8.html" class="volver">← Volver</a>
    <header>
        Utilidad de los Ascensores en la Universidad
    </header>

    <div class="container">
        <div class="transform origin1">
            <div>
                <strong>Accesibilidad:</strong> Permiten el acceso a personas con discapacidad, movilidad reducida o temporales.<br><br>
                <strong>Comodidad:</strong> Facilitan el desplazamiento en edificios altos.<br><br>
                <strong>Transporte:</strong> Se usan para mover materiales entre pisos.
            </div>
        </div>

        <div class="transform origin2">
            <img src="asensor.jpg" alt="Imagen de ascensor">
        </div>
    </div>
</body>
</html>
